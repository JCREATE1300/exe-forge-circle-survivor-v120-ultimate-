name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install

      - name: Build executable
        run: npx electron-packager . circle-survivor-v120-ultimate- --platform=win32 --arch=x64 --overwrite --asar

      - name: Build NSIS installer
        run: makensis installer.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: circle-survivor-v120-ultimate--Setup
          path: circle-survivor-v120-ultimate--Setup.exe

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: circle-survivor-v120-ultimate--Setup.exe
          tag_name: v1.0.${{ github.run_number }}
          name: circle-survivor-v120-ultimate- v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
